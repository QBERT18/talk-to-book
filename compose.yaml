services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/talk-to-book?replicaSet=rs0&directConnection=true}
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Self-initiating single-node replica set. On first boot rs.status() throws
      # (NotYetInitialized), so we fall through to rs.initiate(); on later boots
      # rs.status().ok is 1 and initiate is skipped. Required because the app's
      # updateBookAction uses mongoose session.withTransaction().
      test: >
        mongosh --quiet --port 27017 --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
